<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
<div class="chat-container">
    <div class="chat-window">
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" placeholder="Напишіть повідомлення..." id="text-to-send">
            <button id="send-message" onclick=sendMessageButton()>Відправити</button>
        </div>
    </div>
    <div class="chat-list">
        <h2>Чати</h2>
        <div class="chat-list-content" id="chat-list-content">
            <ul id="chat-list"></ul>
        </div>

        <div class="add-chat-container">
            <button class="add-chat-btn" onclick="toggleChatForm()">Додати чат</button>
        </div>

        <div id="overlay" class="overlay">
            <div id="add-chat-form" class="add-chat-form">
                <div class="add-chat-header">
                    <h3 id="chat-form-tittle">Додавання чату</h3>
                    <span class="close-form" id="close-form" onclick="toggleChatForm()">×</span>
                </div>
                <div class="chat-form-body">
                    <div class="add-chat-left">
                        <div class="chat-type-switch" id="chat-type-switch">
                            <label><input type="radio" name="chatType" value="personal" id="radio-personal" checked> Персональний</label>
                            <label><input type="radio" name="chatType" value="group" id="radio-group"> Груповий</label>
                        </div>
                        <input type="text" id="new-chat-name" placeholder="Назва чату" />
                    </div>
                    <div class="add-chat-right">
                        <div id="user-selection">
                            <div class="user-filter">
                                <input type="text" id="user-filter-pattern" placeholder="Пошук користувача...">
                                <button onclick="applyUserFilter()">Пошук</button>
                            </div>
                            <div id="user-list-container"></div>
                        </div>
                    </div>
                </div>
                <button onclick="addChat()" id="button-add-chat">Додати чат</button>
                <div id="error-message" style="color: red; margin-top: 5px;"></div>
            </div>
        </div>
    </div>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    let currentChatId = null;
    let userName = null;
    let currentMessageList = null;
    let stompClient = null;
    const selectedUsers = new Set();
    let isEditing = false;

    let currentMessagesPage = 0;
    let currentChatPage = 0;
    let isLoadingMessages = false;
    let isLoadingChats = false;
    let isAllChatMessagesDownloaded = false;
    let isAllChatsDownloaded = false;
    let messageLoadGeneration = 0;

    const pageSize = 20;

    function sameId(a, b) {
        return a != null && b != null && String(a) === String(b);
    }

    function connectSocket() {
        if (typeof SockJS === 'undefined' || typeof Stomp === 'undefined') {
            console.error('SockJS/STOMP libraries are not available.');
            return;
        }

        const socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);

            stompClient.subscribe('/topic/messages-for-user-' + userName, function (msg) {
                let json;
                try {
                    json = JSON.parse(msg.body);
                } catch (error) {
                    console.error('Invalid WebSocket message:', error, msg.body);
                    return;
                }

                if (sameId(json.chatId, currentChatId)) {
                    if (json.method === 'ADD_MESSAGE') {
                        fetch('/notify-message', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({id: json.id})
                        })
                            .then(response => {
                                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                                return response.text();
                            })
                            .then(data => {
                                if (data.includes('OK')) {
                                    showMessage(json.author, json.text, json.date, json.id);
                                }
                            })
                            .catch(error => console.error('Помилка notify-message:', error));
                    } else if (json.method === 'REMOVE_MESSAGE') {
                        deleteMessageForUser(json.id);
                    } else if (json.method === 'CHANGE_MESSAGE') {
                        editMessageForUser(json.id, json.text);
                    } else if (json.method === 'ACCESS_ERROR') {
                        alert('У вас немає доступу');
                    } else {
                        console.warn('Unknown WebSocket method:', json.method);
                    }
                } else {
                    const chatItem = document.getElementById('chat-' + json.chatId);

                    if (!chatItem) {
                        refreshChats();
                        return;
                    }

                    const badge = chatItem.querySelector('.new-message-badge');
                    if (!badge) return;

                    const count = parseInt(badge.textContent, 10) || 0;
                    badge.textContent = String(count + 1);
                    badge.style.display = 'flex';
                }
            });
        }, function (error) {
            console.error('STOMP connection error:', error);
        });

        socket.onclose = function () {
            console.warn('Зʼєднання втрачено. Повторне підключення...');
            setTimeout(connectSocket, 3000);
        };
    }

    async function getUser() {
        try {
            const response = await fetch('/get-user');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            userName = data.name;
            return true;
        } catch (error) {
            console.error('Помилка завантаження користувача:', error);
            return false;
        }
    }

    function setupChatInfiniteScroll() {
        const chatListContainer = document.getElementById('chat-list-content');
        if (!chatListContainer) {
            console.error('Container for chats not found!');
            return;
        }

        chatListContainer.addEventListener('scroll', () => {
            const reachedBottom =
                chatListContainer.scrollTop + chatListContainer.clientHeight >=
                chatListContainer.scrollHeight - 10;

            if (reachedBottom && !isLoadingChats && !isAllChatsDownloaded) {
                loadChats();
            }
        });
    }

    async function loadChats() {
        if (isLoadingChats || isAllChatsDownloaded) return false;
        isLoadingChats = true;

        const chatList = document.getElementById('chat-list');
        try {
            const response = await fetch(`/get-user-chats?page=${currentChatPage}&size=${pageSize}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            if (!Array.isArray(data)) throw new Error('Unexpected chats response format');

            if (data.length === 0) {
                isAllChatsDownloaded = true;
                return false;
            }

            data.forEach(chat => {
                if (document.getElementById('chat-' + chat.id)) return;
                chatList.appendChild(showChat(chat.id, chat.chatName, chat.unNotified));
            });

            currentChatPage++;
            if (data.length < pageSize) isAllChatsDownloaded = true;
            return true;
        } catch (error) {
            console.error('Помилка завантаження чатів:', error);
            return false;
        } finally {
            isLoadingChats = false;
        }
    }

    async function fillChatListIfNeeded() {
        const container = document.getElementById('chat-list-content');
        if (!container) return;

        let guard = 0;
        while (
            !isAllChatsDownloaded &&
            container.scrollHeight <= container.clientHeight &&
            guard < 10
        ) {
            const loaded = await loadChats();
            if (!loaded) break;
            guard++;
        }
    }

    function showChat(chatId, chatName, unreadCount) {
        const chatItem = document.createElement('li');
        chatItem.classList.add('chat-item');
        chatItem.id = 'chat-' + chatId;

        const chatLeft = document.createElement('div');
        chatLeft.classList.add('chat-left');

        const badge = document.createElement('span');
        badge.classList.add('new-message-badge');

        const isCurrentChat = sameId(currentChatId, chatId);
        if ((Number(unreadCount) || 0) > 0 && !isCurrentChat) {
            badge.textContent = String(unreadCount);
            badge.style.display = 'flex';
        } else {
            badge.textContent = '0';
            badge.style.display = 'none';
        }

        const nameSpan = document.createElement('span');
        nameSpan.classList.add('chat-name');
        nameSpan.textContent = chatName ?? '';

        chatLeft.appendChild(badge);
        chatLeft.appendChild(nameSpan);

        const chatRight = document.createElement('div');
        chatRight.classList.add('chat-right');

        const menuBtn = document.createElement('button');
        menuBtn.type = 'button';
        menuBtn.classList.add('chat-options-btn');
        menuBtn.textContent = '⋮';
        menuBtn.onclick = event => toggleChatMenu(event, menuBtn);

        const menu = document.createElement('div');
        menu.classList.add('chat-options-menu');

        const infoItem = document.createElement('div');
        infoItem.textContent = 'Інформація';
        infoItem.onclick = event => {
            event.stopPropagation();
            showChatInfo(chatId);
        };

        const editItem = document.createElement('div');
        editItem.textContent = 'Редагувати';
        editItem.onclick = event => {
            event.stopPropagation();
            editChat(chatId);
        };

        const deleteItem = document.createElement('div');
        deleteItem.textContent = 'Видалити';
        deleteItem.onclick = event => {
            event.stopPropagation();
            deleteChat(chatId);
        };

        menu.appendChild(infoItem);
        menu.appendChild(editItem);
        menu.appendChild(deleteItem);
        chatRight.appendChild(menuBtn);
        chatRight.appendChild(menu);

        if (isCurrentChat) {
            chatItem.style.backgroundColor = '#d4edda';
        }

        chatItem.onclick = function () {
            getChatMessages(chatId, currentChatId);
            badge.textContent = '0';
            badge.style.display = 'none';
        };

        chatItem.appendChild(chatLeft);
        chatItem.appendChild(chatRight);
        return chatItem;
    }

    async function deleteChat(chatId) {
        try {
            const response = await fetch('/delete-chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: chatId})
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.text();
            if (data.includes('OK')) {
                if (sameId(currentChatId, chatId)) {
                    currentChatId = null;
                    localStorage.removeItem('lastChat');
                    document.getElementById('messages').innerHTML = '';
                }
                await refreshChats();
            }
        } catch (error) {
            console.error('Помилка видалення чату:', error);
        }
    }

    async function editChat(chatId) {
        try {
            const response = await fetch('/get-chat-info?chatId=' + encodeURIComponent(chatId));
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            if (!data.isGroupChat) {
                alert('Редагування персональних чатів заборонено');
                return;
            }

            selectedUsers.clear();
            if (Array.isArray(data.users)) {
                data.users.forEach(user => selectedUsers.add(user));
            }

            openChatForm();

            const radio = document.getElementById('chat-type-switch');
            const exit = document.getElementById('close-form');
            const chatNameInput = document.getElementById('new-chat-name');

            if (radio) radio.style.display = 'none';
            if (exit) exit.style.display = 'none';
            if (chatNameInput) chatNameInput.value = data.chatName ?? '';

            document.getElementById('chat-form-tittle').textContent = 'Редагування чату';
            const button = document.getElementById('button-add-chat');
            button.textContent = 'Редагувати чат';
            button.onclick = () => confirmEditingChat(chatId);

            await loadUserList();
        } catch (error) {
            console.error('Помилка завантаження інформації про чат:', error);
            alert('Виникла помилка під час завантаження інформації про чат. Спробуйте ще раз.');
        }
    }

    async function confirmEditingChat(chatId) {
        const chatNameInput = document.getElementById('new-chat-name');
        const updatedChatName = chatNameInput ? chatNameInput.value.trim() : '';

        if (!updatedChatName) {
            alert('Назва чату не може бути порожньою.');
            return;
        }

        if (updatedChatName.length > 25) {
            alert('Назва чату повинна бути менша або дорівнювати 25 символам');
            return;
        }

        const updatedUsers = Array.from(selectedUsers);

        try {
            const response = await fetch('/update-chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id: chatId,
                    chatName: updatedChatName,
                    users: updatedUsers
                })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.text();
            if (data.includes('OK')) {
                alert('Чат успішно змінено.');
                closeChatForm();
                resetChatForm();
                await refreshChats();
            } else {
                alert('Не вдалося змінити чат. Спробуйте ще раз.');
            }
        } catch (error) {
            console.error('Помилка під час редагування чату:', error);
            alert('Виникла помилка під час редагування чату. Спробуйте ще раз.');
        }
    }

    function clearChats() {
        const list = document.getElementById('chat-list');
        if (list) list.innerHTML = '';
        currentChatPage = 0;
        isAllChatsDownloaded = false;
    }

    async function refreshChats() {
        clearChats();
        await loadChats();
        await fillChatListIfNeeded();
    }

    async function showChatInfo(chatId) {
        try {
            const response = await fetch('/get-chat-info?chatId=' + encodeURIComponent(chatId));
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            alert('admin:' + data.userAdmin + '\nusers:' + data.users);
        } catch (error) {
            console.error('Помилка завантаження інформації про чат:', error);
        }
    }

    function toggleChatMenu(event, button) {
        event.stopPropagation();
        const chatItem = button.closest('.chat-item');
        if (!chatItem) return;

        document.querySelectorAll('.chat-item').forEach(item => {
            if (item !== chatItem) item.classList.remove('show-menu');
        });
        chatItem.classList.toggle('show-menu');
    }

    function getChatMessages(chatId, fromChatId) {
        const previous = fromChatId != null ? document.getElementById('chat-' + fromChatId) : null;
        if (previous) previous.style.backgroundColor = '#F4F4F4FF';

        const current = document.getElementById('chat-' + chatId);
        if (current) current.style.backgroundColor = '#d4edda';

        localStorage.setItem('lastChat', chatId);
        currentChatId = chatId;

        currentMessageList = document.getElementById('messages');
        currentMessageList.innerHTML = '';
        currentMessagesPage = 0;
        isAllChatMessagesDownloaded = false;
        isLoadingMessages = false;
        messageLoadGeneration++;

        loadChatMessages(messageLoadGeneration);
    }

    async function loadChatMessages(generation = messageLoadGeneration) {
        if (currentChatId == null || isLoadingMessages || isAllChatMessagesDownloaded) return;

        const requestedChatId = currentChatId;
        const requestedPage = currentMessagesPage;
        const messagesContainer = document.getElementById('messages');
        if (!messagesContainer) return;

        isLoadingMessages = true;
        const oldScrollHeight = messagesContainer.scrollHeight;

        try {
            const response = await fetch(
                `/get-chat-messages?chatId=${encodeURIComponent(requestedChatId)}&page=${requestedPage}&size=${pageSize}`
            );
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            if (!Array.isArray(data)) throw new Error('Unexpected messages response format');

            if (generation !== messageLoadGeneration || !sameId(requestedChatId, currentChatId)) {
                return;
            }

            if (data.length === 0) {
                isAllChatMessagesDownloaded = true;
                return;
            }

            data.slice().reverse().forEach(msg => {
                showMessage(msg.author, msg.text, msg.date, msg.id, true);
            });

            const newScrollHeight = messagesContainer.scrollHeight;
            messagesContainer.scrollTop += newScrollHeight - oldScrollHeight;

            currentMessagesPage++;
            if (data.length < pageSize) isAllChatMessagesDownloaded = true;
        } catch (error) {
            if (generation === messageLoadGeneration) {
                console.error('Помилка завантаження повідомлень:', error);
            }
        } finally {
            if (generation === messageLoadGeneration) {
                isLoadingMessages = false;
            }
        }

        if (
            generation === messageLoadGeneration &&
            !isAllChatMessagesDownloaded &&
            messagesContainer.scrollHeight <= messagesContainer.clientHeight
        ) {
            await loadChatMessages(generation);
        }
    }

    document.getElementById('messages').addEventListener('scroll', function () {
        if (this.scrollTop <= 10) {
            loadChatMessages();
        }
    });

    function showMessage(author, text, date, id, atTop = false) {
        if (document.getElementById('message-' + id)) return;

        const newMessage = document.createElement('div');
        const isMyMessage = author === userName ? 'user' : 'other';
        newMessage.classList.add('message', isMyMessage, `message-${id}`);
        newMessage.id = 'message-' + id;

        const authorSpan = document.createElement('span');
        authorSpan.classList.add('author');
        authorSpan.textContent = author ?? '';

        const optionsWrapper = document.createElement('div');
        optionsWrapper.classList.add('message-options-wrapper');

        const optionsButton = document.createElement('button');
        optionsButton.type = 'button';
        optionsButton.classList.add('message-options-btn');
        optionsButton.textContent = '⋮';
        optionsButton.addEventListener('click', event => {
            event.stopPropagation();
            toggleDropdown(optionsButton);
        });

        const dropdown = document.createElement('div');
        dropdown.classList.add('message-dropdown-content');

        const editLink = document.createElement('a');
        editLink.textContent = 'Редагувати';
        editLink.addEventListener('click', event => {
            event.preventDefault();
            startEditMessage(id, String(text ?? ''));
        });

        const hideLink = document.createElement('a');
        hideLink.textContent = 'Видалити для мене';
        hideLink.addEventListener('click', event => {
            event.preventDefault();
            hideMessageForUser(id);
        });

        const deleteLink = document.createElement('a');
        deleteLink.textContent = 'Видалити';
        deleteLink.addEventListener('click', event => {
            event.preventDefault();
            deleteMessageById(id);
        });

        dropdown.appendChild(editLink);
        dropdown.appendChild(hideLink);
        dropdown.appendChild(deleteLink);
        optionsWrapper.appendChild(optionsButton);
        optionsWrapper.appendChild(dropdown);

        const textSpan = document.createElement('span');
        textSpan.classList.add('text');
        textSpan.textContent = text ?? '';
        textSpan.style.whiteSpace = 'pre-wrap';

        const timestamp = document.createElement('span');
        timestamp.classList.add('timestamp');
        const parsedDate = new Date(date);
        timestamp.textContent = Number.isNaN(parsedDate.getTime())
            ? ''
            : parsedDate.toLocaleString('uk-UA', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });

        newMessage.appendChild(authorSpan);
        newMessage.appendChild(optionsWrapper);
        newMessage.appendChild(textSpan);
        newMessage.appendChild(timestamp);

        if (atTop) {
            currentMessageList.prepend(newMessage);
        } else {
            currentMessageList.appendChild(newMessage);
            currentMessageList.scrollTop = currentMessageList.scrollHeight;
        }
    }

    async function hideMessageForUser(id) {
        try {
            const response = await fetch('/hide-message-for-user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: id, author: userName})
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.text();
            if (data.includes('OK')) deleteMessageForUser(id);
        } catch (error) {
            console.error('Помилка приховування повідомлення:', error);
        }
    }

    function deleteMessageById(messageId) {
        if (!stompClient || !stompClient.connected || currentChatId == null) {
            console.warn('Cannot delete message: WebSocket is not connected or chat is not selected.');
            return;
        }

        stompClient.send('/app/send-message', {}, JSON.stringify({
            id: messageId,
            method: 'REMOVE_MESSAGE',
            chatId: currentChatId
        }));
    }

    function deleteMessageForUser(messageId) {
        const messageElement = document.getElementById(`message-${messageId}`);
        if (messageElement) messageElement.remove();
    }

    function startEditMessage(id, oldText) {
        const textInput = document.getElementById('text-to-send');
        textInput.value = oldText;
        isEditing = true;
        textInput.focus();
        textInput.dataset.editId = id;
    }

    function editMessageForUser(messageId, newText) {
        const messageElement = document.getElementById('message-' + messageId);
        if (!messageElement) return;

        const textElement = messageElement.querySelector('.text');
        if (textElement) {
            textElement.textContent = newText ?? '';
            textElement.style.whiteSpace = 'pre-wrap';
        }
    }

    function toggleDropdown(button) {
        const wrapper = button.closest('.message-options-wrapper');
        if (!wrapper) return;

        document.querySelectorAll('.message-options-wrapper.open').forEach(item => {
            if (item !== wrapper) item.classList.remove('open');
        });
        wrapper.classList.toggle('open');
    }

    document.addEventListener('click', function (event) {
        if (!event.target.closest('.show-menu')) {
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('show-menu'));
        }

        if (!event.target.closest('.message-options-wrapper')) {
            document.querySelectorAll('.message-options-wrapper.open').forEach(item => {
                item.classList.remove('open');
            });
        }
    });

    function sendMessageButton() {
        const textInput = document.getElementById('text-to-send');
        const text = textInput.value.trim();
        if (!text) return;

        if (currentChatId == null) {
            alert('Спочатку виберіть чат.');
            return;
        }

        if (!stompClient || !stompClient.connected) {
            alert("З'єднання з WebSocket ще не встановлено.");
            return;
        }

        if (isEditing && textInput.dataset.editId) {
            stompClient.send('/app/send-message', {}, JSON.stringify({
                id: textInput.dataset.editId,
                text: text,
                chatId: currentChatId,
                method: 'CHANGE_MESSAGE'
            }));
            isEditing = false;
            delete textInput.dataset.editId;
        } else {
            stompClient.send('/app/send-message', {}, JSON.stringify({
                chatId: currentChatId,
                text: text,
                method: 'ADD_MESSAGE'
            }));
        }

        textInput.value = '';
    }

    document.getElementById('text-to-send').addEventListener('keyup', function (event) {
        if (event.key === 'Enter') sendMessageButton();
    });

    function openChatForm() {
        const form = document.getElementById('add-chat-form');
        const overlay = document.getElementById('overlay');
        const userSelection = document.getElementById('user-selection');
        if (form) form.style.display = 'block';
        if (overlay) overlay.style.display = 'block';
        if (userSelection) userSelection.style.display = 'block';
    }

    function closeChatForm() {
        const form = document.getElementById('add-chat-form');
        const overlay = document.getElementById('overlay');
        const userSelection = document.getElementById('user-selection');
        if (form) form.style.display = 'none';
        if (overlay) overlay.style.display = 'none';
        if (userSelection) userSelection.style.display = 'none';
    }

    function resetChatForm() {
        selectedUsers.clear();

        const chatName = document.getElementById('new-chat-name');
        const filter = document.getElementById('user-filter-pattern');
        const radio = document.getElementById('chat-type-switch');
        const exit = document.getElementById('close-form');
        const personal = document.getElementById('radio-personal');
        const group = document.getElementById('radio-group');
        const title = document.getElementById('chat-form-tittle');
        const button = document.getElementById('button-add-chat');
        const error = document.getElementById('error-message');

        if (chatName) chatName.value = '';
        if (filter) filter.value = '';
        if (radio) radio.style.display = '';
        if (exit) exit.style.display = '';
        if (personal) personal.checked = true;
        if (group) group.checked = false;
        if (title) title.textContent = 'Додавання чату';
        if (button) {
            button.textContent = 'Додати чат';
            button.onclick = addChat;
        }
        if (error) error.textContent = '';
    }

    async function toggleChatForm() {
        const form = document.getElementById('add-chat-form');
        if (!form) return;

        const isVisible = form.style.display === 'block';
        if (isVisible) {
            closeChatForm();
            resetChatForm();
            return;
        }

        resetChatForm();
        openChatForm();
        await loadUserList();
    }

    async function addChat() {
        const chatNameElement = document.getElementById('new-chat-name');
        const chatName = chatNameElement.value.trim();

        if (!chatName) {
            alert('Введіть назву чату.');
            return;
        }
        if (chatName.length > 25) {
            alert('Назва чату повинна бути менша або дорівнювати 25 символам');
            return;
        }

        const checked = document.querySelector('input[name="chatType"]:checked');
        if (!checked) {
            alert('Оберіть тип чату.');
            return;
        }

        const isGroup = checked.value === 'group';
        const users = Array.from(new Set([userName, ...selectedUsers]));

        if (isGroup && users.length < 2) {
            alert('Додайте хоча б одного учасника для групового чату.');
            return;
        }
        if (!isGroup && users.length !== 2) {
            alert('Можна додати лише 1 учасника');
            return;
        }

        try {
            const response = await fetch('/create-new-chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    isGroupChat: isGroup,
                    userAdmin: userName,
                    chatName: chatName,
                    users: users
                })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.text();
            if (data.includes('OK')) {
                closeChatForm();
                resetChatForm();
                await refreshChats();
            } else {
                document.getElementById('error-message').textContent = data;
            }
        } catch (error) {
            document.getElementById('error-message').textContent = String(error);
        }
    }

    async function loadUserList(filter = '', page = 0) {
        const container = document.getElementById('user-list-container');
        if (!container) return;

        if (page === 0) container.innerHTML = '';

        try {
            const response = await fetch(
                `/search-users?pattern=${encodeURIComponent(filter)}&page=${encodeURIComponent(page)}`
            );
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const users = await response.json();
            if (!Array.isArray(users)) throw new Error('Unexpected users response format');

            users.forEach(user => {
                if (user.name === userName) return;

                const div = document.createElement('div');
                div.classList.add('user-entry');
                div.dataset.username = user.name;
                div.style.padding = '5px';
                div.style.border = '1px solid #ccc';
                div.style.marginBottom = '5px';
                div.style.borderRadius = '4px';
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';
                div.style.backgroundColor = 'white';

                const nameSpan = document.createElement('span');
                nameSpan.textContent = user.name;

                const addBtn = document.createElement('button');
                addBtn.type = 'button';
                addBtn.textContent = '+';
                addBtn.classList.add('user-add-btn');
                addBtn.style.backgroundColor = '#007bff';
                addBtn.style.color = 'white';
                addBtn.style.border = 'none';
                addBtn.style.borderRadius = '4px';
                addBtn.style.padding = '5px';
                addBtn.style.width = '32px';
                addBtn.style.textAlign = 'center';
                addBtn.style.fontWeight = 'bold';
                addBtn.style.fontSize = '16px';
                addBtn.style.cursor = 'pointer';

                addBtn.onclick = () => toggleUserSelection(user.name, div, addBtn);

                if (selectedUsers.has(user.name)) {
                    div.style.backgroundColor = '#d4edda';
                    addBtn.textContent = '×';
                }

                div.appendChild(nameSpan);
                div.appendChild(addBtn);
                container.appendChild(div);
            });
        } catch (error) {
            console.error('Помилка завантаження користувачів:', error);
        }
    }

    function toggleUserSelection(username, containerDiv, buttonDiv) {
        if (selectedUsers.has(username)) {
            selectedUsers.delete(username);
            buttonDiv.textContent = '+';
            containerDiv.style.backgroundColor = 'white';
        } else {
            selectedUsers.add(username);
            buttonDiv.textContent = '×';
            containerDiv.style.backgroundColor = '#d4edda';
        }
    }

    function applyUserFilter() {
        const pattern = document.getElementById('user-filter-pattern').value;
        loadUserList(pattern, 0);
    }

    window.onload = async function () {
        const userLoaded = await getUser();
        if (!userLoaded) return;

        const lastChat = localStorage.getItem('lastChat');
        if (lastChat) currentChatId = lastChat;

        setupChatInfiniteScroll();
        currentMessageList = document.getElementById('messages');

        await loadChats();
        await fillChatListIfNeeded();

        connectSocket();
        await loadUserList();

        if (currentChatId != null) {
            getChatMessages(currentChatId, null);
        }
    };
</script>
</html>
